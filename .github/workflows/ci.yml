name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Run formatting check
        run: |
          uv run --locked --extra dev black --check llmproxy tests
          uv run --locked --extra dev isort --check-only llmproxy tests

      - name: Run linting
        run: |
          uv run --locked --extra dev flake8 llmproxy tests

      - name: Run type checking
        run: |
          uv run --locked --extra dev mypy llmproxy

      - name: Run tests
        run: |
          uv run --locked --extra dev pytest
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
