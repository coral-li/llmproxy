name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Update pip certificate bundle
        # Use patched uv to replace pip without invoking its old certificate bundle.
        # Remove the pip cooldown exception after October 27, 2026.
        run: uv pip install --system "pip==26.2.2" --exclude-newer-package pip=false

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Run formatting check
        run: |
          uv run --locked --extra dev black --check llmproxy tests
          uv run --locked --extra dev isort --check-only llmproxy tests

      - name: Run linting
        run: |
          uv run --locked --extra dev flake8 llmproxy tests

      - name: Run type checking
        run: |
          uv run --locked --extra dev mypy llmproxy

      - name: Run tests
        run: |
          uv run --locked --extra dev pytest
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  workflow_security:
    name: Workflow Security
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Fails when .github/workflows/actions.lock is out of sync with the
      # workflows, or a locked commit no longer verifies upstream.
      - name: Verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

      - name: Audit workflows with zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@v0.8.1
        # No `version:`: zizmor follows the release this locked action ships
        # (1.32.0 for v0.8.1), so bumping the action updates it.
        with:
          advanced-security: false
          annotations: true
          # Low and informational findings are advisory.
          min-severity: medium
